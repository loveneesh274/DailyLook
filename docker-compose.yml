version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stylemirror_db
    environment:
      POSTGRES_USER: stylemirror
      POSTGRES_PASSWORD: stylemirror123
      POSTGRES_DB: stylemirror
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylemirror"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stylemirror_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
